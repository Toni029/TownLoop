<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <!-- Gold Gradient for Diamond -->
    <linearGradient id="vipGoldDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD438" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#E68A00" />
    </linearGradient>

    <!-- Gold Gradient for Plaque -->
    <linearGradient id="vipPlaqueGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFCE1A" />
      <stop offset="100%" stop-color="#FF9E00" />
    </linearGradient>

    <!-- Text Gold Gradient -->
    <linearGradient id="vipTextGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFB3" />
      <stop offset="35%" stop-color="#FFF066" />
      <stop offset="70%" stop-color="#FFBA00" />
      <stop offset="100%" stop-color="#D97700" />
    </linearGradient>
  </defs>

  <!-- ================= BACKGROUND DIAMOND ================= -->
  <!-- Dark Pixel Outline of Diamond -->
  <polygon points="64,4 124,64 64,124 4,64" fill="#241200" />
  
  <!-- Outer Bevel Dark Shadow (Bottom Half) -->
  <polygon points="64,120 120,64 114,64 64,114 14,64 8,64" fill="#8C4400" />

  <!-- Inner Diamond Body -->
  <polygon points="64,8 118,62 64,116 10,62" fill="url(#vipGoldDiamond)" />

  <!-- Top-Left Diamond Bright Highlight Ridge -->
  <polyline points="12,62 64,10 116,62" fill="none" stroke="#FFF7A8" stroke-width="3" />
  <polyline points="16,62 64,14 112,62" fill="none" stroke="#FFE159" stroke-width="2" />

  <!-- Diamond Inner Groove Pattern -->
  <polygon points="64,22 102,60 64,98 26,60" fill="none" stroke="#E68A00" stroke-width="2" stroke-dasharray="3,3" />

  <!-- ================= FOREGROUND PLAQUE ================= -->
  <!-- Plaque Drop Shadow -->
  <rect x="19" y="37" width="90" height="54" fill="#241200" rx="1" />
  
  <!-- Plaque Dark Outline -->
  <rect x="18" y="36" width="92" height="52" fill="#241200" rx="1" />
  
  <!-- Plaque Gold Rim/Bevel -->
  <rect x="20" y="38" width="88" height="48" fill="#C77800" />
  <rect x="20" y="38" width="88" height="46" fill="#FFAE00" />
  <rect x="20" y="38" width="86" height="46" fill="#FFDB4D" />
  <rect x="21" y="39" width="84" height="44" fill="#FFF294" />

  <!-- Plaque Main Gold Center Plate -->
  <rect x="23" y="41" width="82" height="42" fill="url(#vipPlaqueGold)" />

  <!-- Plaque Highlights (Top & Left Crisp Pixel Edges) -->
  <line x1="22" y1="40" x2="103" y2="40" stroke="#FFFFFF" stroke-width="2" />
  <line x1="22" y1="40" x2="22" y2="81" stroke="#FFFFFF" stroke-width="2" />

  <!-- Corner Sparkle / Pixel Shine on Top-Right -->
  <rect x="99" y="40" width="3" height="2" fill="#FFFFFF" />
  <rect x="101" y="42" width="2" height="3" fill="#FFFFFF" />

  <!-- ================= "STAFF" PIXEL ART TYPOGRAPHY ================= -->
  <!-- Letter Drop Shadow / Deep Brown Silhouette behind each character -->
  <!-- S -->
  <path d="
    M 28 50 h 12 v 4 h -8 v 4 h 8 v 14 h -12 v -4 h 8 v -4 h -8 z
  " fill="#421400" transform="translate(1.5, 2)" />
  
  <!-- T -->
  <path d="
    M 42 50 h 12 v 4 h -4 v 18 h -4 v -18 h -4 z
  " fill="#421400" transform="translate(1.5, 2)" />

  <!-- A -->
  <path d="
    M 56 50 h 12 v 22 h -4 v -8 h -4 v 8 h -4 z
    M 60 54 h 4 v 6 h -4 z
  " fill="#421400" transform="translate(1.5, 2)" />

  <!-- F 1 -->
  <path d="
    M 70 50 h 12 v 4 h -8 v 4 h 6 v 4 h -6 v 10 h -4 z
  " fill="#421400" transform="translate(1.5, 2)" />

  <!-- F 2 -->
  <path d="
    M 84 50 h 12 v 4 h -8 v 4 h 6 v 4 h -6 v 10 h -4 z
  " fill="#421400" transform="translate(1.5, 2)" />

  <!-- Letter Dark Red-Brown Stroke / Outlines -->
  <!-- S -->
  <path d="
    M 27 49 h 14 v 6 h -8 v 2 h 8 v 16 h -14 v -6 h 8 v -2 h -8 z
  " fill="#691F00" />
  
  <!-- T -->
  <path d="
    M 41 49 h 14 v 6 h -4 v 18 h -6 v -18 h -4 z
  " fill="#691F00" />

  <!-- A -->
  <path d="
    M 55 49 h 14 v 24 h -5 v -7 h -4 v 7 h -5 z
    M 59 53 h 6 v 7 h -6 z
  " fill="#691F00" />

  <!-- F 1 -->
  <path d="
    M 69 49 h 14 v 6 h -8 v 3 h 7 v 5 h -7 v 10 h -6 z
  " fill="#691F00" />

  <!-- F 2 -->
  <path d="
    M 83 49 h 14 v 6 h -8 v 3 h 7 v 5 h -7 v 10 h -6 z
  " fill="#691F00" />

  <!-- Letter Front Golden Fill -->
  <!-- S -->
  <path d="
    M 28 50 h 12 v 4 h -8 v 4 h 8 v 14 h -12 v -4 h 8 v -4 h -8 z
  " fill="url(#vipTextGold)" />
  
  <!-- T -->
  <path d="
    M 42 50 h 12 v 4 h -4 v 18 h -4 v -18 h -4 z
  " fill="url(#vipTextGold)" />

  <!-- A -->
  <path d="
    M 56 50 h 12 v 22 h -4 v -8 h -4 v 8 h -4 z
    M 60 54 h 4 v 6 h -4 z
  " fill="url(#vipTextGold)" />

  <!-- F 1 -->
  <path d="
    M 70 50 h 12 v 4 h -8 v 4 h 6 v 4 h -6 v 10 h -4 z
  " fill="url(#vipTextGold)" />

  <!-- F 2 -->
  <path d="
    M 84 50 h 12 v 4 h -8 v 4 h 6 v 4 h -6 v 10 h -4 z
  " fill="url(#vipTextGold)" />

  <!-- Top Inner Highlights on letters -->
  <rect x="29" y="51" width="10" height="2" fill="#FFFFFF" opacity="0.85" />
  <rect x="43" y="51" width="10" height="2" fill="#FFFFFF" opacity="0.85" />
  <rect x="57" y="51" width="10" height="2" fill="#FFFFFF" opacity="0.85" />
  <rect x="71" y="51" width="10" height="2" fill="#FFFFFF" opacity="0.85" />
  <rect x="85" y="51" width="10" height="2" fill="#FFFFFF" opacity="0.85" />
</svg>
